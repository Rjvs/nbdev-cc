[project]
name = "nbdev-mcp"
version = "0.1.0"
description = "MCP server and plugin for nbdev notebook development with Claude Code"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "mcp>=1.0",
]

[project.scripts]
nbdev-mcp = "nbdev_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nbdev_mcp"]
